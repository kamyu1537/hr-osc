[package]
name = "hr-osc-tauri"
version = "0.4.1"
description = "Heartrate program for OSC"
authors = ["Byeon Seongun"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
rosc = "0.11"
once_cell = "1.17"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
keyring = "4"

[features]
# Required: release builds serve frontendDist through custom-protocol; tauri dev passes --no-default-features.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
